name: Compilar Android-Toolkit.Pro (.NET Framework 4.5.2)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Descargar el código
      uses: actions/checkout@v4

    - name: Instalar .NET Framework 4.5.2 Developer Pack
      run: choco install netfx-4.5.2-devpack -y --no-progress --ignore-checksums

    - name: Configurar MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Restaurar dependencias
      run: nuget restore src/Android-Toolkit.Pro.csproj

    - name: Compilar en modo Release
      run: msbuild src/Android-Toolkit.Pro.csproj /p:Configuration=Release /p:Platform="Any CPU" /v:minimal

    - name: Verificar que la carpeta Tools se copió
      run: |
        echo "=== Contenido de bin\Release ==="
        dir src\bin\Release
        echo "=== Contenido de bin\Release\Tools ==="
        dir src\bin\Release\Tools

    - name: Empaquetar el ejecutable + Tools
      run: |
        mkdir AndroidToolkitPro-Release
        Copy-Item src\bin\Release\* AndroidToolkitPro-Release\ -Recurse -Force
      shell: pwsh

    - name: Subir artefacto
      uses: actions/upload-artifact@v4
      with:
        name: Android-Toolkit-Pro-Framework452
        path: AndroidToolkitPro-Release/
        retention-days: 30
